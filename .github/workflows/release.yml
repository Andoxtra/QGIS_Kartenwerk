name: release

# Push a version tag (e.g. `git tag v2.2.0 && git push origin v2.2.0`) to build
# kartenwerk.zip and publish it as a GitHub Release. The tag must match
# `version=` in plugin/kartenwerk/metadata.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches metadata.txt
        run: python dev/check_version.py "${GITHUB_REF_NAME}"
      - name: Offline tests
        run: python dev/test_zones.py
      - name: Build kartenwerk.zip
        run: python install_plugin.py --zip kartenwerk.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" kartenwerk.zip \
            --title "Kartenwerk ${GITHUB_REF_NAME#v}" \
            --notes "Install: QGIS → Plugins → Manage and Install Plugins → Install from ZIP, then choose kartenwerk.zip. See the README for usage and printing." \
            --generate-notes
